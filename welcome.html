<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - RuralCare</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Welcome Page Specific Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
            text-align: center;
            overflow: hidden;
            overflow-y: auto; /* Scroll enable */
        }
        
        /* Container for proper layout */
        .welcome-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Particle Background */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -2;
        }
        
        /* Glowing Circles */
        .glowing-circles {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .glow-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.4;
        }
        
        .glow-circle:nth-child(1) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #ff0080, transparent);
            top: 10%;
            left: 10%;
            animation: floatGlow 15s infinite ease-in-out;
        }
        
        .glow-circle:nth-child(2) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #00d2ff, transparent);
            bottom: 10%;
            right: 10%;
            animation: floatGlow 20s infinite ease-in-out reverse;
        }
        
        .glow-circle:nth-child(3) {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #ffeb3b, transparent);
            top: 50%;
            left: 80%;
            animation: floatGlow 18s infinite ease-in-out;
        }
        
        /* Logo Section with Hologram Effect */
        .logo-container {
            margin-bottom: 30px;
            animation: hologramAppear 1.5s ease;
            position: relative;
        }
        
        .logo-hologram {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,255,255,0.2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            position: relative;
            box-shadow: 
                0 0 60px rgba(0, 209, 255, 0.7),
                0 0 100px rgba(255, 0, 128, 0.5),
                inset 0 0 20px rgba(255, 255, 255, 0.3);
            animation: hologramPulse 3s infinite alternate, rotate3D 20s infinite linear;
        }
        
        .logo-icon {
            font-size: 4rem;
            background: linear-gradient(45deg, #00d2ff, #ff0080, #ffeb3b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
        }
        
        /* Content Section */
        .content {
            max-width: 900px;
            padding: 0 20px;
            animation: contentAppear 1s ease 0.5s both;
            margin: 0 auto;
        }
        
        .main-title {
            font-size: 2.8rem;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #00d2ff, #ff0080, #ffeb3b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 210, 255, 0.5);
            letter-spacing: 1px;
            line-height: 1.2;
        }
        
        .subtitle {
            font-size: 1.6rem;
            margin-bottom: 30px;
            color: #b3e5fc;
            text-shadow: 0 0 20px rgba(179, 229, 252, 0.5);
            font-weight: 300;
        }
        
        /* ADVANCED CREATOR CARD */
        .creator-container {
            margin: 30px 0;
            animation: cardAppear 1s ease 0.8s both;
            perspective: 1000px;
        }
        
        .creator-card {
            background: linear-gradient(135deg, 
                rgba(255, 0, 128, 0.15) 0%, 
                rgba(0, 210, 255, 0.15) 50%, 
                rgba(255, 235, 59, 0.15) 100%);
            padding: 25px 40px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 25px;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 20px 60px rgba(255, 0, 128, 0.3),
                0 0 100px rgba(0, 210, 255, 0.2),
                inset 0 0 30px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            max-width: 90%;
        }
        
        .creator-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 255, 255, 0.1) 50%,
                transparent 70%
            );
            animation: shine 3s infinite linear;
            transform: rotate(45deg);
        }
        
        .creator-icon {
            font-size: 3rem;
            animation: iconFloat 3s infinite ease-in-out;
            background: linear-gradient(45deg, #ff0080, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 15px currentColor);
        }
        
        .creator-text {
            text-align: left;
            position: relative;
            z-index: 2;
        }
        
        .creator-label {
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: #b3e5fc;
            opacity: 0.9;
        }
        
        .creator-name {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ff0080, #00d2ff, #ffeb3b, #ff0080);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 300% 300%;
            animation: gradientShift 3s infinite alternate;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(255, 0, 128, 0.5);
            margin: 8px 0;
            line-height: 1.1;
        }
        
        .creator-subtitle {
            font-size: 0.9rem;
            color: #ffccbc;
            letter-spacing: 1px;
            margin-top: 8px;
            position: relative;
            padding-left: 15px;
        }
        
        .creator-subtitle::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 8px;
            height: 2px;
            background: linear-gradient(90deg, #ff0080, #00d2ff);
            transform: translateY(-50%);
        }
        
        /* Get Started Button - NEON GLOW (PROPER SIZE) */
        .get-started-btn {
            background: linear-gradient(135deg, 
                rgba(255, 0, 128, 0.9) 0%, 
                rgba(0, 210, 255, 0.9) 100%);
            color: white;
            padding: 18px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin: 30px auto;
            box-shadow: 
                0 0 30px rgba(255, 0, 128, 0.7),
                0 0 60px rgba(0, 210, 255, 0.5),
                inset 0 0 20px rgba(255, 255, 255, 0.3);
            transition: all 0.4s;
            animation: btnAppear 1s ease 1.1s both, btnGlow 2s infinite alternate;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
            text-transform: uppercase;
            min-width: 250px;
            max-width: 90%;
            z-index: 10;
        }
        
        .get-started-btn:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 
                0 0 40px rgba(255, 0, 128, 0.9),
                0 0 80px rgba(0, 210, 255, 0.7),
                inset 0 0 25px rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
        }
        
        .get-started-btn:active {
            transform: scale(0.98) translateY(0);
        }
        
        .get-started-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 255, 255, 0.3) 50%,
                transparent 70%
            );
            animation: btnShine 3s infinite linear;
            transform: rotate(45deg);
        }
        
        .btn-icon {
            font-size: 1.6rem;
            animation: rocketFly 2s infinite ease-in-out;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
        }
        
        /* Footer Note */
        .footer-note {
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            animation: fadeIn 2s ease 1.4s both;
            padding: 0 20px;
        }
        
        /* Remove Countdown */
        .countdown {
            display: none;
        }
        
        /* ADVANCED ANIMATIONS */
        @keyframes hologramPulse {
            0% {
                box-shadow: 
                    0 0 60px rgba(0, 209, 255, 0.7),
                    0 0 100px rgba(255, 0, 128, 0.5),
                    inset 0 0 20px rgba(255, 255, 255, 0.3);
            }
            100% {
                box-shadow: 
                    0 0 80px rgba(0, 209, 255, 0.9),
                    0 0 140px rgba(255, 0, 128, 0.7),
                    inset 0 0 30px rgba(255, 255, 255, 0.5);
            }
        }
        
        @keyframes rotate3D {
            0% {
                transform: rotateY(0deg) rotateX(0deg);
            }
            100% {
                transform: rotateY(360deg) rotateX(10deg);
            }
        }
        
        @keyframes floatGlow {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }
        
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }
        
        @keyframes iconFloat {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-15px) rotate(10deg);
            }
        }
        
        @keyframes shine {
            0% {
                transform: rotate(45deg) translateX(-100%);
            }
            100% {
                transform: rotate(45deg) translateX(100%);
            }
        }
        
        @keyframes hologramAppear {
            from {
                opacity: 0;
                transform: translateY(-50px) scale(0.5);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }
        
        @keyframes contentAppear {
            from {
                opacity: 0;
                transform: translateY(30px);
                filter: blur(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }
        
        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(50px) rotateX(-45deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }
        
        @keyframes btnAppear {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        @keyframes btnGlow {
            0%, 100% {
                box-shadow: 
                    0 0 25px rgba(255, 0, 128, 0.7),
                    0 0 50px rgba(0, 210, 255, 0.5),
                    inset 0 0 15px rgba(255, 255, 255, 0.3);
            }
            50% {
                box-shadow: 
                    0 0 35px rgba(255, 0, 128, 0.9),
                    0 0 70px rgba(0, 210, 255, 0.7),
                    inset 0 0 20px rgba(255, 255, 255, 0.4);
            }
        }
        
        @keyframes btnShine {
            0% {
                transform: rotate(45deg) translateX(-100%) translateY(-100%);
            }
            100% {
                transform: rotate(45deg) translateX(100%) translateY(100%);
            }
        }
        
        @keyframes rocketFly {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-8px) rotate(-5deg);
            }
            75% {
                transform: translateY(8px) rotate(5deg);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2.2rem;
            }
            
            .subtitle {
                font-size: 1.3rem;
            }
            
            .creator-card {
                padding: 20px 25px;
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
            
            .creator-text {
                text-align: center;
            }
            
            .creator-name {
                font-size: 1.8rem;
            }
            
            .creator-icon {
                font-size: 2.5rem;
            }
            
            .get-started-btn {
                padding: 16px 35px;
                font-size: 1.1rem;
                min-width: 220px;
            }
            
            .logo-hologram {
                width: 130px;
                height: 130px;
            }
            
            .logo-icon {
                font-size: 3.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .main-title {
                font-size: 1.8rem;
            }
            
            .subtitle {
                font-size: 1.1rem;
            }
            
            .logo-hologram {
                width: 110px;
                height: 110px;
            }
            
            .logo-icon {
                font-size: 3rem;
            }
            
            .creator-name {
                font-size: 1.6rem;
            }
            
            .creator-card {
                padding: 15px 20px;
                gap: 12px;
            }
            
            .get-started-btn {
                padding: 14px 30px;
                font-size: 1rem;
                min-width: 200px;
                gap: 10px;
            }
            
            .btn-icon {
                font-size: 1.4rem;
            }
        }
        
        /* For very small screens */
        @media (max-height: 600px) {
            .welcome-container {
                padding: 10px;
            }
            
            .logo-container {
                margin-bottom: 20px;
            }
            
            .creator-container {
                margin: 20px 0;
            }
            
            .get-started-btn {
                margin: 20px auto;
            }
        }
        .creator-image-container {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        overflow: hidden;
        border: 3px solid rgba(255, 255, 255, 0.3);
        box-shadow: 
            0 0 30px rgba(255, 0, 128, 0.5),
            0 0 50px rgba(0, 210, 255, 0.3);
        animation: floatImage 3s infinite ease-in-out;
        position: relative;
        z-index: 2;
    }
    
    .creator-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s;
    }
    
    .creator-image:hover {
        transform: scale(1.1);
    }
    
    @keyframes floatImage {
        0%, 100% {
            transform: translateY(0) rotate(0deg);
            box-shadow: 
                0 0 30px rgba(255, 0, 128, 0.5),
                0 0 50px rgba(0, 210, 255, 0.3);
        }
        50% {
            transform: translateY(-15px) rotate(5deg);
            box-shadow: 
                0 0 40px rgba(255, 0, 128, 0.7),
                0 0 70px rgba(0, 210, 255, 0.5);
        }
    }
    
    /* Adjust creator-card for image */
    .creator-card {
        gap: 30px;
        align-items: center;
    }
    </style>
</head>
<body>
    <!-- Particle Background -->
    <div id="particles-js"></div>
    
    <!-- Glowing Circles -->
    <div class="glowing-circles">
        <div class="glow-circle"></div>
        <div class="glow-circle"></div>
        <div class="glow-circle"></div>
    </div>
    
    <div class="welcome-container">
        <!-- Logo -->
        <div class="logo-container">
            <div class="logo-hologram">
                <span class="logo-icon">🏥</span>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="content">
            <h1 class="main-title">
                Welcome to RuralCare
            </h1>
            
            <h2 class="subtitle">
                Doctor Appointment System
            </h2>
            
            <!-- ADVANCED CREATOR CARD -->
            <div class="creator-card">
    <!-- Icon की जगह Image -->
    <div class="creator-image-container">
        <img src="raja.jpg" alt="Raj Golu" class="creator-image">
    </div>
    <div class="creator-text">
        <div class="creator-label">Crafted with Passion By</div>
        <div class="creator-name">RAJ GOLU</div>
        <div class="creator-subtitle">Full Stack Developer & UI/UX Designer</div>
    </div>
</div>
            
            <!-- Get Started Button -->
            <button class="get-started-btn" onclick="startApp()" id="startBtn">
                <span class="btn-icon">🚀</span>
                Let's Get Started
            </button>
            
            <!-- Footer Note -->
            <div class="footer-note">
                <p>Revolutionizing Rural Healthcare Through Technology</p>
                <p style="margin-top: 10px; font-size: 0.8rem; opacity: 0.7;">
                    Click the button above to continue
                </p>
            </div>
        </div>
    </div>

    <!-- Particles.js Library -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <script>
        // Initialize Particles.js
        particlesJS('particles-js', {
            particles: {
                number: { value: 60, density: { enable: true, value_area: 800 } },
                color: { value: "#ffffff" },
                shape: { type: "circle" },
                opacity: { value: 0.4, random: true },
                size: { value: 2, random: true },
                line_linked: {
                    enable: true,
                    distance: 120,
                    color: "#ffffff",
                    opacity: 0.2,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 1.5,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "out",
                    bounce: false
                }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: { enable: true, mode: "repulse" },
                    onclick: { enable: true, mode: "push" }
                }
            },
            retina_detect: true
        });

        // Start App Function - ONLY ON BUTTON CLICK
        function startApp() {
            const btn = document.getElementById('startBtn');
            
            // Disable button and show loading
            btn.disabled = true;
            btn.innerHTML = '<span class="btn-icon" style="animation: rocketFly 0.5s infinite">🚀</span> Launching...';
            
            // Create launch effect
            document.querySelector('.logo-hologram').style.animation = 'hologramPulse 0.5s infinite';
            
            // Redirect to main page after short delay
            setTimeout(() => {
                window.location.href = 'index.html'; // Change to your main page filename
            }, 1000);
        }
        
        // Add click effect to creator card
        document.querySelector('.creator-card').addEventListener('click', function() {
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = 'scale(1)';
            }, 150);
        });
        
        // Keyboard shortcut (Enter or Space to start)
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Enter' || e.code === 'Space') {
                startApp();
            }
        });
        
        // Ensure button is visible on load
        window.addEventListener('load', function() {
            const btn = document.getElementById('startBtn');
            btn.style.opacity = '1';
            btn.style.visibility = 'visible';
        });
        
    </script>
</body>
</html>
